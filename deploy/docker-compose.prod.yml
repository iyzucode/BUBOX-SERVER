# Stack produksi LUANNA: Caddy (HTTPS) → web (Expo static) + api (.NET) → postgres.
#
# Struktur folder di VPS (kedua repo bersebelahan):
#   /opt/luanna/Server   ← repo BUBOX-SERVER (file ini: Server/deploy/)
#   /opt/luanna/Client   ← repo BUBOX-CLIENT
#
# Jalankan dari folder deploy/:  docker compose -f docker-compose.prod.yml up -d --build
# Semua rahasia dibaca dari deploy/.env (salin dari .env.example; JANGAN di-commit).

name: luanna

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bubox_db
      POSTGRES_USER: bubox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      # postgres 18+ menyimpan data di subfolder per versi di bawah /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubox -d bubox_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: luanna-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=bubox_db;Username=bubox;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY wajib diisi di .env}
      Cors__AllowedOrigins__0: https://${DOMAIN:?DOMAIN wajib diisi di .env}
      Midtrans__ServerKey: ${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY wajib diisi di .env}
      Midtrans__IsProduction: ${MIDTRANS_IS_PRODUCTION:-false}
      Email__Mode: ${EMAIL_MODE:-Smtp}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS wajib diisi di .env}
      Email__Smtp__Password: ${RESEND_API_KEY:-}
      GoogleMaps__ServerApiKey: ${GOOGLE_MAPS_SERVER_KEY:-}
      # Client ID yang sama dengan web: API hanya menerima ID token Google untuk client ini.
      Google__ClientIds__0: ${GOOGLE_WEB_CLIENT_ID:?GOOGLE_WEB_CLIENT_ID wajib diisi di .env}
    # Tidak ada "ports": API hanya bisa dicapai lewat Caddy. Ini juga yang membuat header
    # X-Forwarded-For aman dipercaya (lihat ForwardedHeaders di Program.cs).
    networks: [backend, edge]
    logging: *logging

  web:
    build:
      context: ../../Client
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://${DOMAIN}/api
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
        EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
    image: luanna-web:latest
    restart: unless-stopped
    networks: [edge]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL wajib diisi di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    logging: *logging

networks:
  # backend internal: postgres tidak punya akses internet & tidak bisa dijangkau dari luar.
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
