Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning

AllowedHosts: "*"

# Origin lain yang boleh memanggil API dari browser. Produksi web & API satu domain, jadi
# biasanya cukup domain itu (env Cors__AllowedOrigins__0). Kosong di Development = semua.
Cors:
  AllowedOrigins: []

ConnectionStrings:
  DefaultConnection: "Host=localhost;Port=5432;Database=bubox_db;Username=postgres;Password=postgres;"

# Key RAHASIA, tidak di repo: produksi lewat env Jwt__Key (acak, min. 32 karakter);
# lokal di configuration.Development.yml. API menolak jalan bila kosong.
Jwt:
  Issuer: "Bubox.Api"
  Audience: "Bubox.Client"
  ExpiryMinutes: 1440

# Midtrans Core API (QRIS). Jangan commit ServerKey: isi lewat environment variable
# Midtrans__ServerKey dan Midtrans__IsProduction di server/docker-compose.
Midtrans:
  ServerKey: ""
  IsProduction: false
  QrisAcquirer: "gopay"

# Email OTP. Mode "Log" = hanya tulis ke log (development); "Smtp" = kirim sungguhan.
# Resend: Host smtp.resend.com, Port 465, Username "resend", Password = API key.
# Jangan commit API key: isi lewat environment variable Email__Smtp__Password.
# FromAddress harus dari domain yang sudah diverifikasi di Resend; sebelum itu pakai
# onboarding@resend.dev (hanya bisa mengirim ke email pemilik akun Resend).
Email:
  Mode: "Log"
  FromAddress: "onboarding@resend.dev"
  FromName: "LUANNA"
  Smtp:
    Host: "smtp.resend.com"
    Port: 465
    Username: "resend"
    Password: ""
    TimeoutSeconds: 15

# Login Google (alur ID token). Client ID bukan rahasia; client secret tidak dipakai.
# Tambahkan Client ID Android/iOS ke daftar ini saat aplikasi ponsel siap.
Google:
  ClientIds:
    - "331482618694-7lbeh050haoe6p544ppgdkucbld57fk3.apps.googleusercontent.com"

# Google Maps (alamat). ServerApiKey = key khusus server untuk Geocoding API; RAHASIA:
# isi di configuration.Development.yml atau environment variable GoogleMaps__ServerApiKey.
# Key browser (peta & pencarian) ada di Client: EXPO_PUBLIC_GOOGLE_MAPS_API_KEY.
GoogleMaps:
  ServerApiKey: ""
  CacheHours: 24

OrderExpiry:
  Enabled: true

Menu:
  MaxImageSizeMB: 1
  MaxImageSizeBytes: 1048576

# Foto profil (disimpan di database). Aplikasi sudah memperkecil foto ke 512px sebelum unggah.
Profile:
  MaxAvatarBytes: 2097152
